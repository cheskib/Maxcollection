<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxcollection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Maxcollection</h1>
    <p class="tagline">Collections management — members, charges &amp; payments</p>
  </header>

  <main>
    <section class="summary" id="summary">
      <div class="stat"><span class="stat-label">Members</span><span class="stat-value" id="stat-members">–</span></div>
      <div class="stat"><span class="stat-label">Total charged</span><span class="stat-value" id="stat-charged">–</span></div>
      <div class="stat"><span class="stat-label">Total collected</span><span class="stat-value" id="stat-paid">–</span></div>
      <div class="stat"><span class="stat-label">Outstanding</span><span class="stat-value" id="stat-outstanding">–</span></div>
    </section>

    <section class="forms">
      <form id="member-form" class="card">
        <h2>Add member</h2>
        <input name="name" placeholder="Name *" required>
        <input name="email" type="email" placeholder="Email">
        <input name="phone" placeholder="Phone">
        <button type="submit">Add member</button>
      </form>

      <form id="charge-form" class="card">
        <h2>Add charge</h2>
        <select name="member_id" required data-member-select></select>
        <input name="description" placeholder="Description *" required>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount *" required>
        <input name="due_date" type="date">
        <button type="submit">Add charge</button>
      </form>

      <form id="payment-form" class="card">
        <h2>Record payment</h2>
        <select name="member_id" required data-member-select></select>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount *" required>
        <select name="method">
          <option value="cash">Cash</option>
          <option value="check">Check</option>
          <option value="card">Card</option>
          <option value="transfer">Transfer</option>
          <option value="other" selected>Other</option>
        </select>
        <input name="reference" placeholder="Reference / check #">
        <button type="submit">Record payment</button>
      </form>
    </section>

    <section class="card">
      <h2>Members</h2>
      <table id="members-table">
        <thead>
          <tr><th>Name</th><th>Contact</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Balance</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
